<body>
    <header>

    <script>
        const toggleButton = document.querySelector('.toggle');
        const sidebar = document.getElementById('sidebar');
        const closeButton = document.getElementById('close-btn');

        // Sidebar functionality
        toggleButton.addEventListener('click', () => {
            sidebar.style.left = '0';
        });

        closeButton.addEventListener('click', () => {
            sidebar.style.left = '-250px';
        });
        // Set initial balance from localStorage or default to 0
let balance = parseFloat(localStorage.getItem("balance")) || 0.000;
const balanceDisplay = document.querySelector(".balance");
const taskList = document.getElementById("task-list");

// Update the balance display
function updateBalance() {
    balanceDisplay.textContent = `BALANCE: $${balance.toFixed(3)}`;
    localStorage.setItem("balance", balance); // Save to localStorage
}

// Show loading screen
function showLoadingScreen() {
    document.getElementById("loading-overlay").style.display = "flex";
    setTimeout(() => {
        document.getElementById("loading-overlay").style.display = "none";
        showTaskPopup();
    }, 2000);
}

// Show the task popup
function showTaskPopup() {
    document.getElementById("task-popup").style.display = "flex";

    // Prevent duplicating task buttons
    if (taskList.childElementCount === 0) {
        createTaskButtons();
    }
}

// Close the task popup
document.getElementById("close-popup").addEventListener("click", () => {
    document.getElementById("task-popup").style.display = "none";
});

// Create task buttons dynamically
function createTaskButtons() {
    const tasks = [
        { name: "Click to Earn $0.001", reward: 0.001, action: earnClick },
        { name: "View Ad and Earn $0.010", reward: 0.010, action: viewAd }
    ];

    tasks.forEach(task => {
        const button = document.createElement("button");
        button.textContent = task.name;
        button.className = "task-button";
        button.addEventListener("click", () => task.action(task.reward));
        taskList.appendChild(button);
    });
}

// Task actions
function earnClick(reward) {
    balance += reward;
    updateBalance();
    alert(`You earned $${reward.toFixed(3)} for clicking!`);
}

let adButtonCooldown = false;

function viewAd(reward) {
    if (adButtonCooldown) {
        alert("Please wait a few seconds before viewing another ad.");
        return;
    }

    // First, update the balance
    balance += reward;
    updateBalance();

    // Disable the button and start cooldown
    adButtonCooldown = true;

    // Redirect to the ad URL
    window.location.href = "https://poawooptugroo.com/4/7950037"; // Redirect to your ad page

    // Set a timeout to re-enable the button after 5 seconds
    setTimeout(() => {
        adButtonCooldown = false;
        alert("You can now view another ad!");
    }, 5000); // 5000 ms = 5 seconds
}

// Start earning button
document.querySelector(".earning-section button").addEventListener("click", () => {
    showLoadingScreen();
});

// Update balance on page load
updateBalance();

    </script>
